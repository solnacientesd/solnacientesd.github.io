<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="description"
      content="Sol Naciente Soluciones Digitales — Showrooms Digitales Interactivos para concesionarias, importadoras y vendedores de alta gama en Asunción."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter+Tight:wght@400;500;600;700;800&family=Montserrat:wght@500;600;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23FFD60A'/%3E%3Ccircle cx='50' cy='50' r='43' fill='none' stroke='%230a0a0b' stroke-width='3'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' font-size='34' fill='%230a0a0b'%3ESOL%3C/text%3E%3C/svg%3E"
    />
    <title>Sol Naciente — Showrooms Digitales Interactivos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var sourceEntry = document.querySelector('script[src*="main.tsx"]');
        if (!sourceEntry) return;
        var root = document.getElementById("root");
        var target = new URL("docs/index.html", window.location.href);

        function showMessage(title, message) {
          root.innerHTML =
            '<main style="box-sizing:border-box;min-height:100vh;padding:clamp(28px,7vw,88px);display:grid;place-items:center;background:#0a0a0b;color:#f5f5f5;font-family:Arial,sans-serif">' +
            '<section style="width:min(100%,680px)">' +
            '<div style="display:flex;align-items:center;gap:16px;margin-bottom:42px">' +
            '<span style="display:grid;place-items:center;width:54px;height:54px;border:3px solid #ffd60a;border-radius:50%;color:#ffd60a;font-weight:900;font-size:15px">SOL</span>' +
            '<span style="color:#ffd60a;font-size:clamp(16px,3vw,23px);font-weight:800;letter-spacing:.04em">SOL NACIENTE</span></div>' +
            '<p style="margin:0 0 12px;color:#ffd60a;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase">GitHub Pages</p>' +
            '<h1 style="margin:0;max-width:620px;font-size:clamp(32px,7vw,56px);line-height:1.05;letter-spacing:-.04em">' + title + '</h1>' +
            '<p style="max-width:570px;margin:20px 0 0;color:#c7c7ca;font-size:17px;line-height:1.6">' + message + '</p>' +
            '</section></main>';
        }

        if (window.location.protocol === "file:") {
          showMessage(
            "Este archivo necesita un servidor para mostrarse.",
            'Ejecuta <code style="color:#ffd60a">start-local.bat</code> en Windows o abre <code style="color:#ffd60a">docs/index.html</code>.',
          );
          return;
        }

        if (!window.location.hostname.endsWith(".github.io")) return;

        window.addEventListener("load", function () {
          window.setTimeout(function () {
            fetch(target.href, { method: "HEAD", cache: "no-store" })
              .then(function (response) {
                if (response.ok) window.location.replace(new URL("docs/", window.location.href).href);
                else showMessage("La publicación se está preparando.", "Actualiza esta página en un minuto.");
              })
              .catch(function () {
                showMessage("No se pudo cargar la versión publicada.", "Revisa el workflow de GitHub Pages y vuelve a intentarlo.");
              });
          }, 150);
        });
      })();
    </script>
  </body>
</html>
